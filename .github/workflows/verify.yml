name: Verify site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GLIFO_VISUAL_PROOF: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:admin
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify private workspace in temporary storage
        run: npm run test:admin
        env:
          GLIFO_TEST_PASSWORD: glifo-isolated-ci-test
          GLIFO_TEST_ISOLATED_BOOTSTRAP: 'true'
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glifo-verification
          path: |
            test-results/
            playwright-report/
          retention-days: 5
